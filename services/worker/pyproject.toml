[project]
name = "pg1-document-ai-worker"
version = "0.1.0"
description = "Document and AI worker scaffold for PG1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
